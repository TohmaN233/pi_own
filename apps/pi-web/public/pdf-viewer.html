<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF 预览</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font:14px system-ui,sans-serif;color:#20242b;background:#e8eaed}body{display:flex;flex-direction:column}header{display:flex;align-items:center;gap:8px;padding:10px 12px;flex-wrap:wrap;background:#fff;border-bottom:1px solid #d6d9dd}button,input{font:inherit;padding:5px 8px;border:1px solid #ccd0d5;border-radius:4px;background:white;color:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}input{width:60px}#status{padding:8px 12px;margin:0;background:#fff;font-size:12px}#error{padding:16px;color:#b32318;white-space:pre-wrap;background:#fff}#pages{flex:1;min-height:0;overflow:auto;padding:16px;scrollbar-gutter:stable}.page{position:relative;background:white;margin:0 auto 16px;box-shadow:0 2px 6px #0002;max-width:none}.page canvas{display:block;width:100%;height:100%}.page-label{position:absolute;inset:12px auto auto 12px;color:#777}.page[data-rendered=true] .page-label{display:none}#zoom-label{min-width:40px;text-align:center}
</style></head>
<body>
<header aria-label="PDF 阅读工具"><button id="previous" disabled>上一页</button><label>页 <input id="page-number" type="number" min="1" value="1" disabled></label><span id="page-count">/ —</span><button id="next" disabled>下一页</button><button id="zoom-out" disabled aria-label="缩小">−</button><span id="zoom-label">100%</span><button id="zoom-in" disabled aria-label="放大">＋</button><button id="fit" disabled>适合宽度</button></header>
<p id="status" role="status">正在加载 PDF 阅读器…</p><div id="error" role="alert" hidden></div><main id="pages" aria-label="PDF 页面"></main>
<script type="module" src="/pdf-viewer.mjs"></script>
</body></html>
