name: Apply reviewed Mode Pack P1 payload

on:
  push:
    branches:
      - feature/mode-pack-platform-fallback
    paths:
      - 'scripts/.apply-mode-pack-p1.mjs'
      - '.github/workflows/apply-mode-pack-p1.yml'

permissions:
  contents: write

concurrency:
  group: apply-mode-pack-p1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'TohmaN233/pi_own'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'

      - name: Verify and apply the reviewed payload
        run: node scripts/.apply-mode-pack-p1.mjs

      - name: Run dependency-free syntax and invariant checks
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --check apps/pi-web/lib/mode-pack-runtime.ts
          node --experimental-strip-types --check apps/pi-web/lib/mode-pack-session-store.ts
          node --experimental-strip-types --check apps/pi-web/lib/mode-pack-pi-resources.ts
          node --experimental-strip-types --check apps/pi-web/lib/mode-pack-workflow-runtime.ts
          node --experimental-strip-types --check apps/pi-web/lib/mode-pack-pi-runtime.ts
          node --experimental-strip-types --check apps/pi-web/lib/mode-pack-service.ts
          node --experimental-strip-types --check apps/pi-web/lib/mode-pack-client.ts
          node --experimental-strip-types --check 'apps/pi-web/app/api/mode-packs/session/route.ts'
          node --experimental-strip-types --check 'apps/pi-web/app/api/agent/[id]/route.ts'
          node --experimental-strip-types --check packages/education-mode-host/src/persistence.ts
          node --check scripts/mode-pack-session-runtime.test.mjs
          node --check scripts/mode-pack-workflow-runtime.test.mjs
          node --check scripts/mode-pack-live-wiring.test.mjs
          node --check apps/pi-web/lib/mode-pack-pi-runtime.test.mjs
          node --test apps/pi-web/components/harness/HarnessShell.test.mjs
          node --test scripts/mode-pack-session-runtime.test.mjs

      - name: Commit the exact reviewed source file set
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/pi-web/lib/mode-pack-runtime.ts \
            apps/pi-web/lib/mode-pack-session-store.ts \
            apps/pi-web/lib/mode-pack-pi-resources.ts \
            apps/pi-web/lib/mode-pack-workflow-runtime.ts \
            apps/pi-web/lib/mode-pack-pi-runtime.ts \
            apps/pi-web/lib/mode-pack-service.ts \
            apps/pi-web/lib/mode-pack-client.ts \
            'apps/pi-web/app/api/mode-packs/session/route.ts' \
            'apps/pi-web/app/api/agent/[id]/route.ts' \
            packages/education-mode-host/src/persistence.ts \
            apps/pi-web/components/harness/HarnessShell.tsx \
            apps/pi-web/components/harness/HarnessShell.test.mjs \
            apps/pi-web/lib/mode-pack-pi-runtime.test.mjs \
            scripts/mode-pack-session-runtime.test.mjs \
            scripts/mode-pack-workflow-runtime.test.mjs \
            scripts/mode-pack-live-wiring.test.mjs
          git add -u -- \
            packages/education-mode-host/package.json \
            scripts/.apply-mode-pack-p1.mjs \
            scripts/.mode-pack-p1.0 \
            scripts/.mode-pack-p1.1 \
            scripts/.mode-pack-p1.2 \
            scripts/.mode-pack-p1.3
          git diff --cached --check
          git commit -m 'feat: complete live Mode Pack runtime'
          git push origin HEAD:feature/mode-pack-platform-fallback
