name: Repair RPC source-contract ownership

on:
  push:
    branches:
      - feat/mode-pack-foundation
    paths:
      - ".github/workflows/repair-rpc-source-contracts.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/mode-pack-foundation
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/pi-web/package-lock.json

      - name: Rebind source contracts to their implementation owners
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          rpc_test = Path("apps/pi-web/lib/rpc-manager.test.mjs")
          rpc_text = rpc_test.read_text(encoding="utf-8")
          old_read = 'await readFile(new URL("./rpc-manager.ts", import.meta.url), "utf8")'
          new_read = 'await readFile(new URL("./rpc-manager-base.ts", import.meta.url), "utf8")'
          old_count = rpc_text.count(old_read)
          if old_count != 16:
              raise SystemExit(f"expected 16 ordinary RPC source reads, found {old_count}")
          rpc_text = rpc_text.replace(old_read, new_read)
          rpc_test.write_text(rpc_text, encoding="utf-8")

          trust_test = Path("apps/pi-web/lib/project-trust.test.mjs")
          trust_text = trust_test.read_text(encoding="utf-8")
          old_decl = '  const rpcSource = await readFile(new URL("./rpc-manager.ts", import.meta.url), "utf8");\n'
          base_decl = '  const rpcSource = await readFile(new URL("./rpc-manager-base.ts", import.meta.url), "utf8");\n'
          decl_count = trust_text.count(old_decl)
          if decl_count != 2:
              raise SystemExit(f"expected 2 project-trust RPC source declarations, found {decl_count}")
          trust_text = trust_text.replace(old_decl, base_decl)

          first_decl = trust_text.find(base_decl)
          if first_decl < 0:
              raise SystemExit("first project-trust RPC source declaration was not found")
          after_first_decl = first_decl + len(base_decl)
          overlay_decl = '  const modePackRpcSource = await readFile(new URL("./rpc-manager.ts", import.meta.url), "utf8");\n'
          trust_text = trust_text[:after_first_decl] + overlay_decl + trust_text[after_first_decl:]

          marker = '  assert.match(rpcSource, /resourceLoaderReloadOptions: trustReloadOptions/);\n'
          if trust_text.count(marker) != 1:
              raise SystemExit("project-trust insertion marker was not unique")
          overlay_assertions = (
              marker
              + '  assert.match(modePackRpcSource, /import \\* as Base from "\\.\\/rpc-manager-base"/);\n'
              + '  assert.match(modePackRpcSource, /const sessionCwd = options\\.sessionManager\\.getCwd\\(\\)/);\n'
              + '  assert.match(modePackRpcSource, /resourceLoaderReloadOptions: projectTrustReloadOptions\\(sessionCwd, agentDir\\)/);\n'
          )
          trust_text = trust_text.replace(marker, overlay_assertions)
          trust_test.write_text(trust_text, encoding="utf-8")

          boundary_test = Path("apps/pi-web/lib/rpc-manager-source-boundary.test.mjs")
          if boundary_test.exists():
              raise SystemExit(f"temporary repair refuses to overwrite {boundary_test}")
          boundary_test.write_text(
              '''import assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\nimport test from "node:test";\n\ntest("ordinary RPC contracts remain owned by the base implementation while the Mode Pack overlay delegates", async () => {\n  const base = await readFile(new URL("./rpc-manager-base.ts", import.meta.url), "utf8");\n  const overlay = await readFile(new URL("./rpc-manager.ts", import.meta.url), "utf8");\n\n  assert.match(base, /export async function startRpcSession\\(/);\n  assert.match(base, /const sessionCwd = sessionManager\\.getCwd\\(\\)/);\n  assert.match(overlay, /import \\* as Base from "\\.\\/rpc-manager-base"/);\n  assert.match(overlay, /export \\* from "\\.\\/rpc-manager-base"/);\n  assert.match(overlay, /return Base\\.startRpcSession\\(sessionId, sessionFile, cwd, options\\)/);\n  assert.match(overlay, /startPersistedModePackSession\\(sessionId, sessionFile\\)/);\n});\n''',
              encoding="utf-8",
          )
          PY
          git diff --check

      - name: Install Pi Web dependencies
        run: npm ci --prefix apps/pi-web --ignore-scripts

      - name: Run repaired focused tests
        run: |
          cd apps/pi-web
          node --test \
            lib/project-trust.test.mjs \
            lib/rpc-manager.test.mjs \
            lib/rpc-manager-source-boundary.test.mjs

      - name: Run complete Pi Web tests
        run: npm test --prefix apps/pi-web

      - name: Typecheck Pi Web
        run: apps/pi-web/node_modules/.bin/tsc --noEmit -p apps/pi-web/tsconfig.json

      - name: Lint Pi Web
        run: npm run lint --prefix apps/pi-web

      - name: Build Pi Web production application
        run: npm run build --prefix apps/pi-web

      - name: Commit verified repair
        shell: bash
        run: |
          git config user.name "TohmaN233"
          git config user.email "postlewildeman113@gmail.com"
          git add \
            apps/pi-web/lib/project-trust.test.mjs \
            apps/pi-web/lib/rpc-manager.test.mjs \
            apps/pi-web/lib/rpc-manager-source-boundary.test.mjs
          git diff --cached --check
          git commit -m "test(pi-web): rebind RPC source contracts after overlay split"
          git push origin HEAD:feat/mode-pack-foundation
