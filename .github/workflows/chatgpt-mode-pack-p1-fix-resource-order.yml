name: Verify Mode Pack resource-order fix

on:
  push:
    branches:
      - chatgpt/mode-pack-p1-fix-resource-order

permissions:
  contents: write

concurrency:
  group: verify-mode-pack-resource-order-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Apply exact integrity fix and regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          host = Path("packages/mode-pack-host/src/index.ts")
          text = host.read_text()
          old = '''\tif (stableStringify(resourceKeys) !== stableStringify([...resourceKeys].sort())) {\n\t\tthrow new Error(`Resource snapshot ${snapshot.resourceSnapshotId} resources must be sorted`);\n\t}\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected resource sort assertion once, found {text.count(old)}")
          host.write_text(text.replace(old, ""))

          test_file = Path("scripts/mode-pack-runtime-binding.test.mjs")
          text = test_file.read_text()
          needle = "assertGenericModePackSnapshot(firstSnapshot);\n"
          replacement = '''assertGenericModePackSnapshot(firstSnapshot);\nassert.throws(() => assertGenericModePackSnapshot({\n  ...firstSnapshot,\n  resources: [...firstSnapshot.resources].reverse(),\n}), /invalid content hash/i);\n'''
          if text.count(needle) != 1:
              raise SystemExit(f"expected regression insertion point once, found {text.count(needle)}")
          test_file.write_text(text.replace(needle, replacement))
          PY
          git diff --check

      - name: Run Mode Pack host test
        run: node --test scripts/mode-pack-runtime-binding.test.mjs

      - name: Commit verified fix without workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-mode-pack-p1-fix-resource-order.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/mode-pack-host/src/index.ts scripts/mode-pack-runtime-binding.test.mjs .github/workflows/chatgpt-mode-pack-p1-fix-resource-order.yml
          git diff --cached --check
          git commit -m "fix(mode-pack): accept resolver resource order"
          git push origin "HEAD:${GITHUB_REF_NAME}"
