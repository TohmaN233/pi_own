name: Diagnose Mode Pack P1 host test

on:
  push:
    branches:
      - chatgpt/mode-pack-p1-diagnose

permissions:
  contents: write

concurrency:
  group: diagnose-mode-pack-p1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Capture exact host-test output
        shell: bash
        run: |
          set +e
          mkdir -p .chatgpt-diagnostics
          node --test scripts/mode-pack-runtime-binding.test.mjs > .chatgpt-diagnostics/mode-pack-host-test.log 2>&1
          status=$?
          printf '\nEXIT_STATUS=%s\n' "$status" >> .chatgpt-diagnostics/mode-pack-host-test.log
          exit 0

      - name: Commit diagnostic output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .chatgpt-diagnostics/mode-pack-host-test.log
          if ! git diff --cached --quiet; then
            git commit -m "chore: capture Mode Pack host-test diagnostics"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
