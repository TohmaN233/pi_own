name: Diagnose Mode Pack P1 host test

on:
  push:
    branches:
      - chatgpt/mode-pack-p1-diagnose

permissions:
  contents: read

concurrency:
  group: diagnose-mode-pack-p1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Capture exact host-test output
        shell: bash
        run: |
          set +e
          mkdir -p .chatgpt-diagnostics
          node --test scripts/mode-pack-runtime-binding.test.mjs > .chatgpt-diagnostics/mode-pack-host-test.log 2>&1
          status=$?
          printf '\nEXIT_STATUS=%s\n' "$status" >> .chatgpt-diagnostics/mode-pack-host-test.log
          exit 0

      - name: Upload diagnostic output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mode-pack-host-test-log
          path: .chatgpt-diagnostics/mode-pack-host-test.log
          if-no-files-found: error
          retention-days: 1
