name: Export Course Builder workspace

on:
  push:
    branches: [feat/course-builder-beamer]
    paths:
      - ".github/workflows/chatgpt-course-builder-export.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Archive workspace
        run: tar --exclude=.git -czf "$RUNNER_TEMP/pi-own-course-builder-base.tgz" .

      - name: Upload workspace
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pi-own-course-builder-base
          path: ${{ runner.temp }}/pi-own-course-builder-base.tgz
          if-no-files-found: error
          retention-days: 1
