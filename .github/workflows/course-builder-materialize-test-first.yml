name: Course Builder test-first materialization

on:
  push:
    branches: [chatgpt/course-builder-clean-materialize]
    paths:
      - ".github/workflows/course-builder-materialize-test-first.yml"

permissions:
  contents: write

concurrency:
  group: course-builder-test-first-materialization
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout clean integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt/course-builder-clean-materialize
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Write entrypoint regression test and prove red
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts docs/verification
          cat > scripts/course-builder-entrypoint.test.mjs <<'JS'
          import assert from "node:assert/strict";
          import { existsSync } from "node:fs";
          import { pathToFileURL } from "node:url";
          import test from "node:test";
          import { resolve } from "node:path";

          test("Course Builder package exposes a real importable entrypoint", async () => {
            const entrypoint = resolve("packages/course-builder-host/src/index.ts");
            assert.ok(existsSync(entrypoint), "COURSE_BUILDER_ENTRYPOINT_MISSING");
            const module = await import(pathToFileURL(entrypoint).href);
            for (const name of [
              "CourseBuilderHost",
              "compileBeamerDeck",
              "assertSafeBeamerSource",
            ]) {
              assert.equal(typeof module[name], "function", `COURSE_BUILDER_EXPORT_MISSING:${name}`);
            }
          });
          JS

          set +e
          node --experimental-strip-types --test scripts/course-builder-entrypoint.test.mjs > "$RUNNER_TEMP/entry-red.log" 2>&1
          red_status=$?
          set -e
          cat "$RUNNER_TEMP/entry-red.log"
          test "$red_status" -ne 0
          grep -F "COURSE_BUILDER_ENTRYPOINT_MISSING" "$RUNNER_TEMP/entry-red.log" >/dev/null

          {
            echo '# Course Builder entrypoint red/green evidence'
            echo
            echo '## Red phase'
            echo
            echo 'The regression test was executed against the clean main-derived branch before product materialization.'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/entry-red.log"
            echo '```'
          } > docs/verification/COURSE_BUILDER_ENTRYPOINT_RED_GREEN.md

      - name: Recover the previously built Course Builder product tree
        shell: bash
        run: |
          set -euo pipefail
          source_zip="$RUNNER_TEMP/pi-own-course-builder-source.zip"
          source_dir="$RUNNER_TEMP/course-builder-source"
          mkdir -p "$source_dir"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/TohmaN233/pi_own/releases/download/course-builder-working-export/pi-own-course-builder-source.zip" \
            --output "$source_zip"
          unzip -q "$source_zip" -d "$source_dir"

          source_host=$(find "$source_dir" -type f -path '*/packages/course-builder-host/src/host.ts' -print -quit)
          test -n "$source_host"
          source_root=${source_host%/packages/course-builder-host/src/host.ts}
          test -f "$source_root/package.json"
          test -f "$source_root/packages/course-builder-host/src/types.ts"
          test -f "$source_root/packages/course-builder-host/src/beamer.ts"

          rsync -a "$source_root/" ./ \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='apps/pi-web/node_modules/' \
            --exclude='.chatgpt-review/' \
            --exclude='docs/diagnostics/' \
            --exclude='.github/workflows/chatgpt-course-builder-*' \
            --exclude='.github/workflows/course-builder-finalize-and-merge.yml' \
            --exclude='.github/workflows/course-builder-merge-watchdog.yml' \
            --exclude='.github/workflows/course-builder-recover-clean.yml' \
            --exclude='.github/workflows/course-builder-materialize-test-first.yml'

          rm -rf .chatgpt-review docs/diagnostics
          find .github/workflows -maxdepth 1 -type f -name 'chatgpt-course-builder-*' -delete
          rm -f .github/workflows/course-builder-finalize-and-merge.yml
          rm -f .github/workflows/course-builder-merge-watchdog.yml
          rm -f .github/workflows/course-builder-recover-clean.yml
          rm -f .github/workflows/course-builder-materialize-test-first.yml

          cat > packages/course-builder-host/src/index.ts <<'TS'
          export * from "./types.ts";
          export * from "./beamer.ts";
          export * from "./host.ts";
          TS

          mkdir -p third_party/noi1r-beamer-skill
          curl --fail --location --retry 5 --retry-all-errors \
            "https://raw.githubusercontent.com/Noi1r/beamer-skill/f3d62c07f775530eddb13d435b91a9a86e7c9049/LICENSE" \
            --output third_party/noi1r-beamer-skill/LICENSE
          cat > third_party/noi1r-beamer-skill/NOTICE.md <<'MARKDOWN'
          # Noi1r Beamer Skill attribution

          Pi Own's Course Builder was informed by the MIT-licensed Beamer workflow from
          `Noi1r/beamer-skill`, frozen at commit
          `f3d62c07f775530eddb13d435b91a9a86e7c9049`.

          The upstream workflow's create → compile → review → polish → verify lifecycle,
          material analysis, structure approval, compile diagnostics and visual/pedagogical
          review principles were adapted to Pi Own's Mode Pack, revision, approval and Host
          boundaries. Upstream defaults such as a fixed institution, Madrid theme, 10pt,
          16:9, no overlays, mandatory references and backup-slide counts remain configurable
          rather than universal requirements.

          See `LICENSE` in this directory for the upstream MIT terms.
          MARKDOWN

          test -f packages/course-builder-host/src/index.ts
          test -f packages/course-builder-host/src/host.ts
          test -f packages/course-builder-host/src/types.ts
          test -f packages/course-builder-host/src/beamer.ts
          test -f apps/pi-web/app/course-builder/page.tsx
          test -d apps/pi-web/app/api/course-builder
          test -f docs/COURSE_BUILDER.md

      - name: Prove the same entrypoint test is green
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test scripts/course-builder-entrypoint.test.mjs > "$RUNNER_TEMP/entry-green.log" 2>&1
          cat "$RUNNER_TEMP/entry-green.log"
          {
            echo
            echo '## Green phase'
            echo
            echo 'The identical regression test passed after restoring the product tree and adding the real package entrypoint.'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/entry-green.log"
            echo '```'
          } >> docs/verification/COURSE_BUILDER_ENTRYPOINT_RED_GREEN.md

      - name: Normalize permanent Course Builder CI
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/course-builder-ci.yml
          cat > .github/workflows/course-builder.yml <<'YAML'
          name: Course Builder

          on:
            pull_request:
              branches: [main]
              paths:
                - "packages/course-builder-host/**"
                - "packages/learning-harness/**"
                - "packages/profile-resource-host/**"
                - "packages/harness-contracts/**"
                - "apps/pi-web/app/course-builder/**"
                - "apps/pi-web/app/api/course-builder/**"
                - "apps/pi-web/lib/course-builder*"
                - "apps/pi-web/lib/mode-pack*"
                - "apps/pi-web/lib/rpc-manager.ts"
                - "scripts/course-builder*.test.mjs"
                - "third_party/noi1r-beamer-skill/**"
                - "docs/COURSE_BUILDER*"
                - "docs/HARNESS_ACCEPTANCE_CHECKLIST.zh-CN.md"
                - ".github/workflows/course-builder.yml"
            push:
              branches: [main]
              paths:
                - "packages/course-builder-host/**"
                - "packages/learning-harness/**"
                - "packages/profile-resource-host/**"
                - "packages/harness-contracts/**"
                - "apps/pi-web/app/course-builder/**"
                - "apps/pi-web/app/api/course-builder/**"
                - "apps/pi-web/lib/course-builder*"
                - "apps/pi-web/lib/mode-pack*"
                - "apps/pi-web/lib/rpc-manager.ts"
                - "scripts/course-builder*.test.mjs"
                - "third_party/noi1r-beamer-skill/**"
                - "docs/COURSE_BUILDER*"
                - "docs/HARNESS_ACCEPTANCE_CHECKLIST.zh-CN.md"
                - ".github/workflows/course-builder.yml"

          concurrency:
            group: course-builder-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            verify:
              runs-on: ubuntu-24.04
              timeout-minutes: 60
              steps:
                - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
                  with:
                    node-version: 24
                    cache: npm
                - env:
                    PI_ALLOW_LOCKFILE_CHANGE: "1"
                  run: npm install --package-lock-only --ignore-scripts
                - run: npm ci --ignore-scripts
                - name: Course Builder focused tests
                  shell: bash
                  run: |
                    set -euo pipefail
                    mapfile -t tests < <(find scripts -maxdepth 1 -type f -name 'course-builder*.test.mjs' -print | sort)
                    test "${#tests[@]}" -gt 0
                    node --experimental-strip-types --test "${tests[@]}"
                - name: Mode Pack regression tests
                  shell: bash
                  run: |
                    set -euo pipefail
                    mapfile -t tests < <(find scripts -maxdepth 1 -type f -name 'mode-pack*.test.mjs' -print | sort)
                    test "${#tests[@]}" -gt 0
                    node --experimental-strip-types --test "${tests[@]}"
                - run: npm run check
                - run: npm test
                - run: npm run build
                - run: npm ci --prefix apps/pi-web --ignore-scripts
                - run: apps/pi-web/node_modules/.bin/tsc --noEmit -p apps/pi-web/tsconfig.json
                - run: npm run lint --prefix apps/pi-web
                - run: npm test --prefix apps/pi-web
                - run: npm run build --prefix apps/pi-web
          YAML

      - name: Refresh locks and install dependencies
        env:
          PI_ALLOW_LOCKFILE_CHANGE: "1"
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts

      - name: Run focused Course Builder tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find scripts -maxdepth 1 -type f -name 'course-builder*.test.mjs' -print | sort)
          printf 'Course Builder tests:\n%s\n' "${tests[*]}"
          test "${#tests[@]}" -gt 0
          node --experimental-strip-types --test "${tests[@]}"

      - name: Run Mode Pack regression tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find scripts -maxdepth 1 -type f -name 'mode-pack*.test.mjs' -print | sort)
          printf 'Mode Pack tests:\n%s\n' "${tests[*]}"
          test "${#tests[@]}" -gt 0
          node --experimental-strip-types --test "${tests[@]}"

      - name: Run root quality gates
        run: |
          npm run check
          npm test
          npm run build

      - name: Run Pi Web quality gates
        run: |
          npm ci --prefix apps/pi-web --ignore-scripts
          apps/pi-web/node_modules/.bin/tsc --noEmit -p apps/pi-web/tsconfig.json
          npm run lint --prefix apps/pi-web
          npm test --prefix apps/pi-web
          npm run build --prefix apps/pi-web

      - name: Reject temporary materialization residue
        shell: bash
        run: |
          set -euo pipefail
          test ! -d .chatgpt-review
          test ! -d docs/diagnostics
          if find .github/workflows -maxdepth 1 -type f -name 'chatgpt-course-builder-*' -print | grep -q .; then
            echo 'Temporary ChatGPT Course Builder workflow remains' >&2
            exit 1
          fi
          if find . -path './.git' -prune -o -type f \( -name '*course-builder*.patch*' -o -name '*.patch.gz.b64' \) -print | grep -q .; then
            echo 'Temporary Course Builder payload remains' >&2
            exit 1
          fi
          git diff --check

      - name: Commit tested product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name TohmaN233
          git config user.email postlewildeman113@gmail.com
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(agent): add tested Course Builder and Beamer workflow"
          git push origin HEAD:chatgpt/course-builder-clean-materialize
