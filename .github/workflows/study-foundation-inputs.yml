name: Prepare pinned visualization dependency
on:
  push:
    branches: [feat/study-research-foundation]
    paths: [.github/workflows/study-foundation-inputs.yml]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.20.0
          package-manager-cache: false
      - name: Fetch exact published package (no lifecycle scripts, no product writes)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/plotly-input"
          cd "$RUNNER_TEMP/plotly-input"
          npm view plotly.js-strict-dist-min@4.1.0 --json > package-metadata.json
          npm pack plotly.js-strict-dist-min@4.1.0 --ignore-scripts --json > package-pack.json
          sha256sum *.tgz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: study-plotly-strict-input
          path: ${{ runner.temp }}/plotly-input/
          retention-days: 3
          if-no-files-found: error
