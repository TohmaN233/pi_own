name: Materialize clean Course Builder checkpoint

on:
  push:
    branches: [chatgpt/course-builder-clean-materialize]
    paths:
      - ".github/workflows/chatgpt-course-builder-materialize-clean.yml"

permissions:
  contents: write

concurrency:
  group: course-builder-clean-materialize
  cancel-in-progress: false

jobs:
  materialize-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact clean branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt/course-builder-clean-materialize
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.20.0
          cache: npm

      - name: Materialize reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test -s .chatgpt-review/course-builder-clean.patch.gz.b64
          base64 --decode .chatgpt-review/course-builder-clean.patch.gz.b64 > "$RUNNER_TEMP/course-builder.patch.gz"
          gzip -dc "$RUNNER_TEMP/course-builder.patch.gz" > "$RUNNER_TEMP/course-builder.patch"
          test -s "$RUNNER_TEMP/course-builder.patch"
          git apply --check "$RUNNER_TEMP/course-builder.patch"
          git apply "$RUNNER_TEMP/course-builder.patch"
          rm -f \
            .chatgpt-review/course-builder-clean.patch.gz.b64 \
            .github/workflows/chatgpt-course-builder-materialize-clean.yml

          test -s packages/course-builder-host/src/index.ts
          test -s packages/course-builder-host/src/host.ts
          test -s packages/course-builder-host/src/types.ts
          test -s packages/course-builder-host/src/beamer.ts
          test -s apps/pi-web/lib/course-builder-extension.ts
          test -s apps/pi-web/lib/course-builder-import.ts
          test -s apps/pi-web/lib/course-builder-server.ts
          test -s apps/pi-web/app/api/course-builder/route.ts
          test -s apps/pi-web/app/course-builder/page.tsx
          test -s docs/COURSE_BUILDER.md
          test -s third_party/noi1r-beamer-skill/LICENSE
          test -s .github/workflows/course-builder.yml
          node scripts/check-course-builder-product.mjs

          if find .github/workflows -maxdepth 1 -type f -name 'chatgpt-course-builder-*' -print | grep -q .; then
            echo "Temporary Course Builder workflow remains" >&2
            exit 1
          fi
          if find .chatgpt-review -maxdepth 1 -type f -name '*course-builder*' -print 2>/dev/null | grep -q .; then
            echo "Temporary Course Builder payload remains" >&2
            exit 1
          fi
          git diff --check

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Root format and type gates
        run: npm run check

      - name: Course Builder focused tests
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test \
            scripts/course-builder-entry.test.mjs \
            scripts/course-builder-regression.test.mjs \
            scripts/course-builder-product-integration.test.mjs
          node scripts/check-course-builder-product.mjs

      - name: Root tests and build
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run build

      - name: Install Pi Web dependencies
        run: npm ci --prefix apps/pi-web --ignore-scripts

      - name: Pi Web gates
        shell: bash
        run: |
          set -euo pipefail
          apps/pi-web/node_modules/.bin/tsc --noEmit -p apps/pi-web/tsconfig.json
          npm run lint --prefix apps/pi-web
          npm test --prefix apps/pi-web
          npm run build --prefix apps/pi-web

      - name: Commit only the verified product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            packages/course-builder-host \
            packages/profile-resource-host/src/builtin-mode-resources.ts \
            packages/profile-resource-host/src/mode-packs.ts \
            packages/profile-resource-host/src/profile-resource-host.ts \
            apps/pi-web/components/mode-packs/ModePackOverlay.tsx \
            apps/pi-web/lib/harness-server.ts \
            apps/pi-web/lib/mode-pack-inventory.ts \
            apps/pi-web/lib/rpc-manager.ts \
            apps/pi-web/lib/course-builder-client.ts \
            apps/pi-web/lib/course-builder-extension.ts \
            apps/pi-web/lib/course-builder-import.ts \
            apps/pi-web/lib/course-builder-import.test.mjs \
            apps/pi-web/lib/course-builder-server.ts \
            apps/pi-web/app/api/course-builder \
            apps/pi-web/app/course-builder \
            scripts/check-course-builder-product.mjs \
            scripts/course-builder-entry.test.mjs \
            scripts/course-builder-product-integration.test.mjs \
            scripts/course-builder-regression.test.mjs \
            docs/COURSE_BUILDER.md \
            third_party/noi1r-beamer-skill \
            .github/workflows/course-builder.yml
          git add -u -- \
            .chatgpt-review/course-builder-clean.patch.gz.b64 \
            .github/workflows/chatgpt-course-builder-materialize-clean.yml

          unstaged=$(git status --porcelain | awk 'substr($0,2,1) != " " { print }')
          if [ -n "$unstaged" ]; then
            echo "Unexpected unstaged or untracked files after verification:" >&2
            printf '%s\n' "$unstaged" >&2
            exit 1
          fi
          git diff --cached --check
          git status --short
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(agent): add Course Builder and Beamer workflow"
          git push origin HEAD:chatgpt/course-builder-clean-materialize
