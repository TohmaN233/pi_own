name: Recover and verify clean Course Builder

on:
  push:
    branches: [chatgpt/course-builder-clean-materialize]
    paths:
      - ".github/workflows/course-builder-recover-clean.yml"

permissions:
  actions: read
  contents: write

concurrency:
  group: recover-clean-course-builder
  cancel-in-progress: false

jobs:
  recover-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_COMMIT: efb01ef248cc7f9fc8a91c2b4719cf9093ab9b9e
      TARGET_BRANCH: chatgpt/course-builder-clean-materialize
    steps:
      - name: Checkout clean branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt/course-builder-clean-materialize
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.20.0
          cache: npm

      - name: Recover the previously authored product tree
        shell: bash
        run: |
          set -euo pipefail
          recovery="$RUNNER_TEMP/course-builder-recovery"
          downloads="$recovery/downloads"
          extracted="$recovery/extracted"
          mkdir -p "$downloads" "$extracted"

          # Download every still-retained Actions artifact. The original complete
          # implementation was saved as a text patch inside one of these archives.
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" > "$recovery/artifacts.json"
          jq -r '.artifacts[] | select(.expired == false) | [.id, .name] | @tsv' "$recovery/artifacts.json" |
          while IFS=$'\t' read -r artifact_id artifact_name; do
            destination="$downloads/artifact-${artifact_id}-${artifact_name}.zip"
            gh api -H 'Accept: application/vnd.github+json' \
              "/repos/$GITHUB_REPOSITORY/actions/artifacts/${artifact_id}/zip" > "$destination" || rm -f "$destination"
          done

          # The recovery release is temporary and may contain a later complete tree.
          gh release download course-builder-working-export \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'pi-own-course-builder-source.zip' \
            --dir "$downloads/release" || true

          python <<'PY'
          from __future__ import annotations
          import gzip
          import base64
          import shutil
          import tarfile
          import zipfile
          from pathlib import Path

          root = Path('/tmp')
          # RUNNER_TEMP is not guaranteed to equal /tmp on all runners.
          import os
          recovery = Path(os.environ['RUNNER_TEMP']) / 'course-builder-recovery'
          downloads = recovery / 'downloads'
          extracted = recovery / 'extracted'
          extracted.mkdir(parents=True, exist_ok=True)

          queue: list[tuple[Path, int]] = [(p, 0) for p in downloads.rglob('*') if p.is_file()]
          seen: set[tuple[str, int]] = set()
          counter = 0
          while queue:
              archive, depth = queue.pop(0)
              key = (str(archive.resolve()), depth)
              if key in seen or depth > 4:
                  continue
              seen.add(key)
              destination = extracted / f'{counter:04d}'
              counter += 1
              try:
                  if zipfile.is_zipfile(archive):
                      destination.mkdir(parents=True, exist_ok=True)
                      with zipfile.ZipFile(archive) as zf:
                          total = 0
                          for info in zf.infolist():
                              total += info.file_size
                              if info.file_size > 150 * 1024 * 1024 or total > 600 * 1024 * 1024:
                                  raise RuntimeError('archive exceeds recovery budget')
                              target = (destination / info.filename).resolve()
                              if destination.resolve() not in target.parents and target != destination.resolve():
                                  raise RuntimeError('unsafe archive path')
                          zf.extractall(destination)
                  elif tarfile.is_tarfile(archive):
                      destination.mkdir(parents=True, exist_ok=True)
                      with tarfile.open(archive) as tf:
                          total = 0
                          for member in tf.getmembers():
                              total += max(member.size, 0)
                              if member.size > 150 * 1024 * 1024 or total > 600 * 1024 * 1024:
                                  raise RuntimeError('archive exceeds recovery budget')
                              target = (destination / member.name).resolve()
                              if destination.resolve() not in target.parents and target != destination.resolve():
                                  raise RuntimeError('unsafe archive path')
                          tf.extractall(destination, filter='data')
                  else:
                      continue
              except Exception:
                  shutil.rmtree(destination, ignore_errors=True)
                  continue
              for child in destination.rglob('*'):
                  if child.is_file() and child.suffix.lower() in {'.zip', '.tgz', '.gz', '.tar'}:
                      queue.append((child, depth + 1))

          payloads = sorted(extracted.rglob('course-builder.patch.gz.b64'))
          if not payloads:
              raise SystemExit('No preserved Course Builder patch payload was found in retained artifacts')

          valid: list[tuple[int, Path, bytes]] = []
          required_markers = (
              b'packages/course-builder-host/src/index.ts',
              b'apps/pi-web/app/course-builder/page.tsx',
              b'docs/COURSE_BUILDER.md',
          )
          for payload in payloads:
              try:
                  compressed = base64.b64decode(payload.read_bytes(), validate=True)
                  patch = gzip.decompress(compressed)
              except Exception:
                  continue
              score = sum(marker in patch for marker in required_markers)
              if score:
                  valid.append((score, payload, patch))
          if not valid:
              raise SystemExit('Preserved payloads exist, but none contains the complete Course Builder product markers')
          valid.sort(key=lambda item: (item[0], len(item[2])), reverse=True)
          score, source, patch = valid[0]
          if score != len(required_markers):
              raise SystemExit(f'Best preserved payload is incomplete: {source} score={score}')
          (recovery / 'course-builder.patch').write_bytes(patch)
          (recovery / 'payload-source.txt').write_text(str(source), encoding='utf-8')
          print(f'Recovered {len(patch)} patch bytes from {source}')
          PY

          patch="$recovery/course-builder.patch"
          test -s "$patch"
          git apply --check --3way "$patch"
          git apply --3way "$patch"

          # A preserved patch may contain its own transport file. Never retain it.
          rm -rf .chatgpt-review
          find .github/workflows -maxdepth 1 -type f -name 'chatgpt-course-builder-*' -delete
          rm -f docs/diagnostics/COURSE_BUILDER_HISTORY_RECOVERY.md

          required=(
            packages/course-builder-host/src/index.ts
            packages/course-builder-host/src/host.ts
            packages/course-builder-host/src/types.ts
            packages/course-builder-host/src/beamer.ts
            apps/pi-web/app/course-builder/page.tsx
            apps/pi-web/app/api/course-builder/route.ts
            docs/COURSE_BUILDER.md
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "Recovered tree is missing $path" >&2; exit 1; }
          done
          find scripts -maxdepth 1 -type f -name '*course-builder*.test.mjs' | grep -q .
          git diff --check

      - name: Ensure upstream Beamer attribution is complete
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p third_party/noi1r-beamer-skill
          curl --fail --silent --show-error --location \
            'https://raw.githubusercontent.com/Noi1r/beamer-skill/f3d62c07f775530eddb13d435b91a9a86e7c9049/LICENSE' \
            -o third_party/noi1r-beamer-skill/LICENSE
          test -s third_party/noi1r-beamer-skill/NOTICE.md
          grep -F 'f3d62c07f775530eddb13d435b91a9a86e7c9049' \
            third_party/noi1r-beamer-skill/NOTICE.md docs/COURSE_BUILDER.md >/dev/null

      - name: Refresh lock metadata and install root dependencies
        env:
          PI_ALLOW_LOCKFILE_CHANGE: '1'
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts

      - name: Root formatting, type and focused regression gates
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          mapfile -t course_tests < <(find scripts -maxdepth 1 -type f -name '*course-builder*.test.mjs' -print | sort)
          mapfile -t mode_tests < <(find scripts -maxdepth 1 -type f -name 'mode-pack*.test.mjs' -print | sort)
          test "${#course_tests[@]}" -gt 0
          test "${#mode_tests[@]}" -gt 0
          node --experimental-strip-types --test "${course_tests[@]}"
          node --experimental-strip-types --test "${mode_tests[@]}"

      - name: Complete root tests and build
        run: |
          npm test
          npm run build

      - name: Pi Web gates
        run: |
          npm ci --prefix apps/pi-web --ignore-scripts
          apps/pi-web/node_modules/.bin/tsc --noEmit -p apps/pi-web/tsconfig.json
          npm run lint --prefix apps/pi-web
          npm test --prefix apps/pi-web
          npm run build --prefix apps/pi-web

      - name: Commit only the clean product tree
        shell: bash
        env:
          PI_ALLOW_LOCKFILE_CHANGE: '1'
        run: |
          set -euo pipefail
          rm -f .github/workflows/course-builder-recover-clean.yml
          rm -rf .chatgpt-review
          find .github/workflows -maxdepth 1 -type f -name 'chatgpt-course-builder-*' -delete
          rm -f docs/diagnostics/COURSE_BUILDER_HISTORY_RECOVERY.md
          if find . -path './.git' -prune -o -type f \( -name '*.patch' -o -name '*.patch.gz.b64' -o -name '*push-files-probe*' \) -print | grep -q .; then
            echo 'Temporary recovery payload remains in the product tree' >&2
            exit 1
          fi
          git diff --check
          git config user.name 'TohmaN233'
          git config user.email 'postlewildeman113@gmail.com'
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m 'feat(agent): add clean reviewed Course Builder and Beamer workflow'
          git push origin HEAD:"$TARGET_BRANCH"
