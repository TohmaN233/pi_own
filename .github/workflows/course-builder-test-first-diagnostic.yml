name: Course Builder test-first diagnostic gate

on:
  push:
    branches: [chatgpt/course-builder-clean-materialize]
    paths:
      - ".github/workflows/course-builder-test-first-diagnostic.yml"

permissions:
  contents: write

concurrency:
  group: course-builder-test-first-diagnostic
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt/course-builder-clean-materialize
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Materialize candidate and execute all gates with diagnostics
        id: gate
        shell: bash
        env:
          PI_ALLOW_LOCKFILE_CHANGE: "1"
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/logs" scripts docs/verification docs/diagnostics
          report=docs/diagnostics/COURSE_BUILDER_TEST_FIRST_DIAGNOSTIC.md
          : > "$report"
          printf '# Course Builder test-first diagnostic\n\nRun SHA: `%s`\n\n' "$GITHUB_SHA" >> "$report"
          failed=0

          record() {
            name=$1
            shift
            log="$RUNNER_TEMP/logs/${name}.log"
            printf '## %s\n\n```text\n' "$name" >> "$report"
            set +e
            "$@" >"$log" 2>&1
            status=$?
            set -e
            cat "$log"
            printf 'exit=%s\n' "$status" >> "$log"
            tail -c 24000 "$log" >> "$report"
            printf '\n```\n\n' >> "$report"
            if [ "$status" -ne 0 ]; then failed=1; fi
            return 0
          }

          cat > scripts/course-builder-entrypoint.test.mjs <<'JS'
          import assert from "node:assert/strict";
          import { existsSync } from "node:fs";
          import { resolve } from "node:path";
          import { pathToFileURL } from "node:url";
          import test from "node:test";

          test("Course Builder package exposes a real importable entrypoint", async () => {
            const entrypoint = resolve("packages/course-builder-host/src/index.ts");
            assert.ok(existsSync(entrypoint), "COURSE_BUILDER_ENTRYPOINT_MISSING");
            const module = await import(pathToFileURL(entrypoint).href);
            for (const name of ["CourseBuilderHost", "compileBeamerDeck", "assertSafeBeamerSource"]) {
              assert.equal(typeof module[name], "function", `COURSE_BUILDER_EXPORT_MISSING:${name}`);
            }
          });
          JS

          if ! test -f packages/course-builder-host/src/index.ts; then
            set +e
            node --experimental-strip-types --test scripts/course-builder-entrypoint.test.mjs > "$RUNNER_TEMP/logs/entry-red.log" 2>&1
            red_status=$?
            set -e
            if [ "$red_status" -eq 0 ] || ! grep -Fq COURSE_BUILDER_ENTRYPOINT_MISSING "$RUNNER_TEMP/logs/entry-red.log"; then
              echo 'The required red phase did not fail for the missing entrypoint.' >> "$report"
              failed=1
            fi

            source_zip="$RUNNER_TEMP/pi-own-course-builder-source.zip"
            source_dir="$RUNNER_TEMP/course-builder-source"
            mkdir -p "$source_dir"
            record download-source curl --fail --location --retry 5 --retry-all-errors \
              "https://github.com/TohmaN233/pi_own/releases/download/course-builder-working-export/pi-own-course-builder-source.zip" \
              --output "$source_zip"
            if [ -s "$source_zip" ]; then
              record unpack-source unzip -q "$source_zip" -d "$source_dir"
              source_host=$(find "$source_dir" -type f -path '*/packages/course-builder-host/src/host.ts' -print -quit)
              if [ -n "$source_host" ]; then
                source_root=${source_host%/packages/course-builder-host/src/host.ts}
                rsync -a "$source_root/" ./ \
                  --exclude='.git/' \
                  --exclude='node_modules/' \
                  --exclude='apps/pi-web/node_modules/' \
                  --exclude='.chatgpt-review/' \
                  --exclude='docs/diagnostics/' \
                  --exclude='.github/workflows/chatgpt-course-builder-*' \
                  --exclude='.github/workflows/course-builder-*-and-merge.yml' \
                  --exclude='.github/workflows/course-builder-merge-watchdog.yml' \
                  --exclude='.github/workflows/course-builder-recover-clean.yml' \
                  --exclude='.github/workflows/course-builder-materialize-test-first.yml' \
                  --exclude='.github/workflows/course-builder-test-first-diagnostic.yml'
              else
                echo 'Recovered source archive does not contain packages/course-builder-host/src/host.ts.' >> "$report"
                failed=1
              fi
            fi
          fi

          rm -rf .chatgpt-review
          find .github/workflows -maxdepth 1 -type f -name 'chatgpt-course-builder-*' -delete
          rm -f .github/workflows/course-builder-finalize-and-merge.yml \
                .github/workflows/course-builder-merge-watchdog.yml \
                .github/workflows/course-builder-recover-clean.yml \
                .github/workflows/course-builder-materialize-test-first.yml

          if test -f packages/course-builder-host/src/host.ts && ! test -f packages/course-builder-host/src/index.ts; then
            cat > packages/course-builder-host/src/index.ts <<'TS'
          export * from "./types.ts";
          export * from "./beamer.ts";
          export * from "./host.ts";
          TS
          fi

          record entry-green node --experimental-strip-types --test scripts/course-builder-entrypoint.test.mjs
          record lockfile npm install --package-lock-only --ignore-scripts
          record root-install npm ci --ignore-scripts

          mapfile -t course_tests < <(find scripts -maxdepth 1 -type f -name 'course-builder*.test.mjs' -print | sort)
          if [ "${#course_tests[@]}" -eq 0 ]; then
            echo 'No Course Builder tests found.' >> "$report"
            failed=1
          else
            record course-builder-tests node --experimental-strip-types --test "${course_tests[@]}"
          fi

          mapfile -t mode_tests < <(find scripts -maxdepth 1 -type f -name 'mode-pack*.test.mjs' -print | sort)
          if [ "${#mode_tests[@]}" -eq 0 ]; then
            echo 'No Mode Pack regression tests found.' >> "$report"
            failed=1
          else
            record mode-pack-tests node --experimental-strip-types --test "${mode_tests[@]}"
          fi

          record root-check npm run check
          record root-tests npm test
          record root-build npm run build
          record web-install npm ci --prefix apps/pi-web --ignore-scripts
          record web-tsc apps/pi-web/node_modules/.bin/tsc --noEmit -p apps/pi-web/tsconfig.json
          record web-lint npm run lint --prefix apps/pi-web
          record web-tests npm test --prefix apps/pi-web
          record web-build npm run build --prefix apps/pi-web

          if find .github/workflows -maxdepth 1 -type f -name 'chatgpt-course-builder-*' -print | grep -q .; then
            echo 'Temporary ChatGPT Course Builder workflow remains.' >> "$report"
            failed=1
          fi
          if find . -path './.git' -prune -o -type f \( -name '*course-builder*.patch*' -o -name '*.patch.gz.b64' \) -print | grep -q .; then
            echo 'Temporary Course Builder payload remains.' >> "$report"
            failed=1
          fi
          if ! git diff --check >> "$report" 2>&1; then failed=1; fi

          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit only the diagnostic when a gate fails
        if: steps.gate.outputs.failed == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name TohmaN233
          git config user.email postlewildeman113@gmail.com
          git add -- docs/diagnostics/COURSE_BUILDER_TEST_FIRST_DIAGNOSTIC.md \
            .github/workflows/course-builder-test-first-diagnostic.yml
          git commit -m "test: record Course Builder red-green gate failure"
          git push origin HEAD:chatgpt/course-builder-clean-materialize
          exit 1

      - name: Commit the tested clean product tree
        if: steps.gate.outputs.failed == '0'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/course-builder-test-first-diagnostic.yml
          rm -rf docs/diagnostics
          git config user.name TohmaN233
          git config user.email postlewildeman113@gmail.com
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(agent): add tested Course Builder and Beamer workflow"
          git push origin HEAD:chatgpt/course-builder-clean-materialize
