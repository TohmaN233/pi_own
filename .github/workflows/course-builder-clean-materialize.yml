name: Course Builder clean materialize

on:
  push:
    branches: [chatgpt/course-builder-clean-materialize]
    paths:
      - ".github/workflows/course-builder-clean-materialize.yml"

permissions:
  contents: write

concurrency:
  group: course-builder-clean-materialize
  cancel-in-progress: false

jobs:
  materialize-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PI_ALLOW_LOCKFILE_CHANGE: "1"
    steps:
      - name: Checkout clean branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt/course-builder-clean-materialize
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Write product-tree regression and prove it is red on baseline
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/course-builder-product-tree.test.mjs <<'TEST'
          import assert from "node:assert/strict";
          import { existsSync, readdirSync } from "node:fs";
          import test from "node:test";

          const required = [
            "packages/course-builder-host/src/index.ts",
            "packages/course-builder-host/src/host.ts",
            "packages/course-builder-host/src/types.ts",
            "packages/course-builder-host/src/beamer.ts",
            "apps/pi-web/app/course-builder/page.tsx",
            "docs/COURSE_BUILDER.md",
            "third_party/noi1r-beamer-skill/LICENSE",
            "third_party/noi1r-beamer-skill/NOTICE.md",
            ".github/workflows/course-builder.yml",
          ];

          test("Course Builder product tree is complete", () => {
            for (const path of required) assert.equal(existsSync(path), true, `missing ${path}`);
            assert.equal(existsSync("apps/pi-web/app/api/course-builder"), true, "missing Course Builder API tree");
            assert.ok(readdirSync("apps/pi-web/app/api/course-builder", { recursive: true }).some((path) => String(path).endsWith("route.ts")));
          });

          test("Course Builder tree contains no recovery payloads", () => {
            const workflows = readdirSync(".github/workflows");
            assert.deepEqual(workflows.filter((name) => name.startsWith("chatgpt-course-builder-")), []);
            assert.equal(existsSync(".chatgpt-review/course-builder.patch.gz.b64"), false);
            assert.equal(existsSync(".chatgpt-review/push-files-probe.txt"), false);
            assert.equal(existsSync("docs/diagnostics/COURSE_BUILDER_HISTORY_RECOVERY.md"), false);
          });
          TEST
          if node --test scripts/course-builder-product-tree.test.mjs > "$RUNNER_TEMP/red.log" 2>&1; then
            echo "Regression test was expected to fail on the clean baseline." >&2
            cat "$RUNNER_TEMP/red.log" >&2
            exit 1
          fi
          grep -F "missing packages/course-builder-host/src/index.ts" "$RUNNER_TEMP/red.log" >/dev/null

      - name: Recover the previously exported complete source tree
        shell: bash
        run: |
          set -euo pipefail
          gh release download course-builder-working-export \
            --repo "$GITHUB_REPOSITORY" \
            --pattern pi-own-course-builder-source.zip \
            --dir "$RUNNER_TEMP"
          echo 'bcbb9df86321c77fa6e25c3db9a636e23ff8c7bc8ac2803746f12563ac43bd8d  '"$RUNNER_TEMP/pi-own-course-builder-source.zip" | sha256sum --check --strict
          rm -rf "$RUNNER_TEMP/source"
          mkdir -p "$RUNNER_TEMP/source"
          unzip -q "$RUNNER_TEMP/pi-own-course-builder-source.zip" -d "$RUNNER_TEMP/source"

          cp docs/HARNESS_ACCEPTANCE_CHECKLIST.zh-CN.md "$RUNNER_TEMP/HARNESS_ACCEPTANCE_CHECKLIST.zh-CN.md"
          cp docs/MANUAL_ACCEPTANCE_CHECKLIST.zh-CN.md "$RUNNER_TEMP/MANUAL_ACCEPTANCE_CHECKLIST.zh-CN.md"

          rsync -a \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='apps/pi-web/node_modules/' \
            --exclude='.next/' \
            --exclude='dist/' \
            --exclude='.chatgpt-review/' \
            --exclude='.github/workflows/chatgpt-course-builder-*' \
            --exclude='.github/workflows/course-builder-clean-materialize.yml' \
            --exclude='docs/diagnostics/COURSE_BUILDER_HISTORY_RECOVERY.md' \
            "$RUNNER_TEMP/source/" ./

          cp "$RUNNER_TEMP/HARNESS_ACCEPTANCE_CHECKLIST.zh-CN.md" docs/HARNESS_ACCEPTANCE_CHECKLIST.zh-CN.md
          cp "$RUNNER_TEMP/MANUAL_ACCEPTANCE_CHECKLIST.zh-CN.md" docs/MANUAL_ACCEPTANCE_CHECKLIST.zh-CN.md

          rm -rf .chatgpt-review
          rm -f .github/workflows/chatgpt-course-builder-*.yml
          rm -f .github/workflows/course-builder-ci.yml
          rm -f docs/diagnostics/COURSE_BUILDER_HISTORY_RECOVERY.md
          rm -f .github/workflows/course-builder-clean-materialize.yml

      - name: Install a single permanent Course Builder CI workflow
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/course-builder.yml <<'YAML'
          name: Course Builder

          on:
            pull_request:
              branches: [main]
              paths:
                - "packages/course-builder-host/**"
                - "packages/learning-harness/**"
                - "packages/profile-resource-host/**"
                - "packages/harness-contracts/**"
                - "apps/pi-web/app/course-builder/**"
                - "apps/pi-web/app/api/course-builder/**"
                - "apps/pi-web/lib/course-builder*"
                - "apps/pi-web/lib/learning-harness*"
                - "scripts/*course-builder*.test.mjs"
                - "scripts/mode-pack*.test.mjs"
                - "third_party/noi1r-beamer-skill/**"
                - "docs/COURSE_BUILDER*"
                - ".github/workflows/course-builder.yml"
                - "package.json"
                - "package-lock.json"
            push:
              branches: [main]
              paths:
                - "packages/course-builder-host/**"
                - "packages/learning-harness/**"
                - "packages/profile-resource-host/**"
                - "packages/harness-contracts/**"
                - "apps/pi-web/app/course-builder/**"
                - "apps/pi-web/app/api/course-builder/**"
                - "apps/pi-web/lib/course-builder*"
                - "apps/pi-web/lib/learning-harness*"
                - "scripts/*course-builder*.test.mjs"
                - "scripts/mode-pack*.test.mjs"
                - "third_party/noi1r-beamer-skill/**"
                - "docs/COURSE_BUILDER*"
                - ".github/workflows/course-builder.yml"
                - "package.json"
                - "package-lock.json"

          concurrency:
            group: course-builder-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            root:
              name: course-builder-root
              runs-on: ubuntu-24.04
              timeout-minutes: 45
              steps:
                - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
                  with:
                    node-version: 24
                    cache: npm
                - run: npm ci --ignore-scripts
                - name: Product and focused tests
                  shell: bash
                  run: |
                    set -euo pipefail
                    mapfile -t tests < <(find scripts -maxdepth 1 -type f \( -name '*course-builder*.test.mjs' -o -name 'mode-pack*.test.mjs' \) -print | sort)
                    test "${#tests[@]}" -gt 0
                    node --experimental-strip-types --test "${tests[@]}"
                - run: npm run check
                - run: npm test
                - run: npm run build

            pi-web:
              name: course-builder-pi-web
              runs-on: ubuntu-24.04
              timeout-minutes: 45
              steps:
                - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
                  with:
                    node-version: 24
                    cache: npm
                - run: npm ci --prefix apps/pi-web --ignore-scripts
                - run: apps/pi-web/node_modules/.bin/tsc --noEmit -p apps/pi-web/tsconfig.json
                - run: npm run lint --prefix apps/pi-web
                - run: npm test --prefix apps/pi-web
                - run: npm run build --prefix apps/pi-web
          YAML

      - name: Rewrite and pass the product-tree regression
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/course-builder-product-tree.test.mjs <<'TEST'
          import assert from "node:assert/strict";
          import { existsSync, readdirSync } from "node:fs";
          import test from "node:test";

          const required = [
            "packages/course-builder-host/src/index.ts",
            "packages/course-builder-host/src/host.ts",
            "packages/course-builder-host/src/types.ts",
            "packages/course-builder-host/src/beamer.ts",
            "apps/pi-web/app/course-builder/page.tsx",
            "docs/COURSE_BUILDER.md",
            "third_party/noi1r-beamer-skill/LICENSE",
            "third_party/noi1r-beamer-skill/NOTICE.md",
            ".github/workflows/course-builder.yml",
          ];

          test("Course Builder product tree is complete", () => {
            for (const path of required) assert.equal(existsSync(path), true, `missing ${path}`);
            assert.equal(existsSync("apps/pi-web/app/api/course-builder"), true, "missing Course Builder API tree");
            assert.ok(readdirSync("apps/pi-web/app/api/course-builder", { recursive: true }).some((path) => String(path).endsWith("route.ts")));
          });

          test("Course Builder tree contains no recovery payloads", () => {
            const workflows = readdirSync(".github/workflows");
            assert.deepEqual(workflows.filter((name) => name.startsWith("chatgpt-course-builder-")), []);
            assert.equal(existsSync(".chatgpt-review/course-builder.patch.gz.b64"), false);
            assert.equal(existsSync(".chatgpt-review/push-files-probe.txt"), false);
            assert.equal(existsSync("docs/diagnostics/COURSE_BUILDER_HISTORY_RECOVERY.md"), false);
          });
          TEST
          node --test scripts/course-builder-product-tree.test.mjs

      - name: Refresh lock and install root dependencies
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts

      - name: Run complete root gates
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t focused < <(find scripts -maxdepth 1 -type f \( -name '*course-builder*.test.mjs' -o -name 'mode-pack*.test.mjs' \) -print | sort)
          test "${#focused[@]}" -gt 0
          node --experimental-strip-types --test "${focused[@]}"
          npm run check
          npm test
          npm run build

      - name: Run complete Pi Web gates
        run: |
          npm ci --prefix apps/pi-web --ignore-scripts
          apps/pi-web/node_modules/.bin/tsc --noEmit -p apps/pi-web/tsconfig.json
          npm run lint --prefix apps/pi-web
          npm test --prefix apps/pi-web
          npm run build --prefix apps/pi-web

      - name: Verify clean product diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f packages/course-builder-host/src/index.ts
          test -f apps/pi-web/app/course-builder/page.tsx
          test -f docs/COURSE_BUILDER.md
          test -f third_party/noi1r-beamer-skill/LICENSE
          if find .github/workflows -maxdepth 1 -type f -name 'chatgpt-course-builder-*' | grep -q .; then exit 1; fi
          if find . -path './.git' -prune -o -type f \( -name '*course-builder*.patch*' -o -name '*.patch.gz.b64' \) -print | grep -q .; then exit 1; fi
          git status --short

      - name: Commit the tested product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(agent): add tested Course Builder and Beamer workflow"
          git push origin HEAD:chatgpt/course-builder-clean-materialize
