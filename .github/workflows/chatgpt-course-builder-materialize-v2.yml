name: Finalize Course Builder implementation

on:
  push:
    branches: [feat/course-builder-beamer]
    paths:
      - ".github/workflows/chatgpt-course-builder-materialize-v2.yml"

permissions:
  contents: write

concurrency:
  group: finalize-course-builder
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact current branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Materialize implementation idempotently
        shell: bash
        run: |
          set -euo pipefail
          if test -s .chatgpt-review/course-builder.patch.gz.b64; then
            base64 --decode .chatgpt-review/course-builder.patch.gz.b64 > "$RUNNER_TEMP/course-builder.patch.gz"
            gzip -dc "$RUNNER_TEMP/course-builder.patch.gz" > "$RUNNER_TEMP/course-builder.patch"
            test -s "$RUNNER_TEMP/course-builder.patch"
            if git apply --check "$RUNNER_TEMP/course-builder.patch"; then
              git apply "$RUNNER_TEMP/course-builder.patch"
            elif ! test -e packages/course-builder-host/src/index.ts; then
              echo "Course Builder patch neither applies nor appears materialized" >&2
              exit 1
            fi
          fi
          test -e packages/course-builder-host/src/index.ts
          test -e apps/pi-web/app/course-builder/page.tsx
          test -e apps/pi-web/app/api/course-builder/route.ts
          test -e docs/COURSE_BUILDER.md
          rm -f \
            .chatgpt-review/course-builder.patch.gz.b64 \
            .github/workflows/chatgpt-course-builder-export.yml \
            .github/workflows/chatgpt-course-builder-materialize.yml \
            .github/workflows/chatgpt-course-builder-materialize-v2.yml
          git diff --check

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Run Course Builder focused tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find scripts -maxdepth 1 -type f -name '*course-builder*.test.mjs' -print | sort)
          printf 'Focused tests:\n%s\n' "${tests[*]}"
          test "${#tests[@]}" -gt 0
          node --experimental-strip-types --test "${tests[@]}"

      - name: Run repository check
        run: npm run check

      - name: Run repository tests
        run: npm test

      - name: Build repository
        run: npm run build

      - name: Install Pi Web dependencies
        run: npm ci --prefix apps/pi-web --ignore-scripts

      - name: Typecheck Pi Web
        run: apps/pi-web/node_modules/.bin/tsc --noEmit -p apps/pi-web/tsconfig.json

      - name: Lint Pi Web
        run: npm run lint --prefix apps/pi-web

      - name: Test Pi Web
        run: npm test --prefix apps/pi-web

      - name: Build Pi Web
        run: npm run build --prefix apps/pi-web

      - name: Commit actual implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --name-only -z | xargs -0 -r git add --
          git ls-files --others --exclude-standard -z | xargs -0 -r git add --
          git status --short
          if git diff --cached --quiet; then
            echo "No remaining implementation changes to commit"
          else
            git commit -m "feat(agent): add Course Builder and Beamer workflow"
            git push origin HEAD:feat/course-builder-beamer
          fi
