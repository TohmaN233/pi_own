name: Prepare exact baseline model data
on:
  push:
    branches: [chatgpt/course-builder-clean-materialize]
    paths: [.github/workflows/course-builder-dependency-cache.yml]
permissions:
  contents: read
jobs:
  model-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4488561d4449c163d285962943a5db053e8ad09e
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.20.0
          cache: npm
      - name: Hydrate the repository's generated catalog without source edits
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit
          npm run hydrate:model-data
          npm run check:model-data
          git diff --exit-code
          mkdir -p "$RUNNER_TEMP/model-data-export"
          tar -C packages/ai/src/providers -czf "$RUNNER_TEMP/model-data-export/model-data.tar.gz" data
          git rev-parse HEAD > "$RUNNER_TEMP/model-data-export/SOURCE_COMMIT"
          cd "$RUNNER_TEMP/model-data-export"
          sha256sum model-data.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: course-builder-baseline-model-data
          path: ${{ runner.temp }}/model-data-export/
          retention-days: 3
          if-no-files-found: error
