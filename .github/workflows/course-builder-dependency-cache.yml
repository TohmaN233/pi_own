name: Prepare locked offline Course Builder dependencies
on:
  push:
    branches: [chatgpt/course-builder-clean-materialize]
    paths: [.github/workflows/course-builder-dependency-cache.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4488561d4449c163d285962943a5db053e8ad09e
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.20.0
          package-manager-cache: false
      - name: Install exact main lockfiles without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cb-offline"
          npm ci --ignore-scripts --no-audit --cache "$RUNNER_TEMP/cb-npm-cache"
          npm ci --prefix apps/pi-web --ignore-scripts --no-audit --cache "$RUNNER_TEMP/cb-npm-cache"
          git diff --exit-code -- package-lock.json apps/pi-web/package-lock.json
          git archive HEAD | gzip > "$RUNNER_TEMP/cb-offline/main-source.tar.gz"
          prefix=$(dirname "$(dirname "$(command -v node)")")
          tar -C "$prefix" -czf "$RUNNER_TEMP/cb-offline/node-22.20.0.tar.gz" bin include lib share
          tar -C "$RUNNER_TEMP/cb-npm-cache" -czf "$RUNNER_TEMP/cb-offline/npm-cache.tar.gz" _cacache
          {
            git rev-parse HEAD
            node --version
            npm --version
            sha256sum package-lock.json apps/pi-web/package-lock.json
          } > "$RUNNER_TEMP/cb-offline/IDENTITY.txt"
          cd "$RUNNER_TEMP/cb-offline"
          sha256sum *.tar.gz > SHA256SUMS
          ls -lh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: course-builder-locked-offline-dependencies
          path: ${{ runner.temp }}/cb-offline/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
