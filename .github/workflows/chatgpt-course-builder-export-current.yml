name: Export current Course Builder branch

on:
  push:
    branches: [feat/course-builder-beamer]
    paths:
      - ".github/workflows/chatgpt-course-builder-export-current.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Prepare source archive directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          rsync -a --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='apps/pi-web/node_modules' \
            ./ "$RUNNER_TEMP/source/"
      - name: Upload source tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pi-own-course-builder-source
          path: ${{ runner.temp }}/source
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
